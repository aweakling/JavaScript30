    // Array.prototype.filter()
    // 1. Filter the list of inventors for those who were born in the 1500's

    function filterOld (inventors) {
      return inventors.filter(inventor => inventor.year >= 1500 && inventor.year <=1600);
    }

    const old = inventors.filter(inventor => inventor.year >= 1500 && inventor.year <= 1600)

    console.table(old);
    console.table(filterOld(inventors));

    // Array.prototype.map()
    // 2. Give us an array of the inventors first and last names

    function fullName(name){
      return name.map(user => `${user.first} ${user.last}`);
    }

    const fName = inventors.map((user => `${user.first} ${user.last}`));

    console.log(fName);
    console.table(fullName(inventors));

    // Array.prototype.sort()
    // 3. Sort the inventors by birthdate, oldest to youngest

    function oldest (age) {
      return age.sort((a, b) => a.year - b.year);
    }

    const oldOld = inventors.sort((a, b) => a.year - b.year);

    console.table(oldest(inventors));
    console.table(oldOld);

    // Array.prototype.reduce()
    // 4. How many years did all the inventors live all together?

    function total (years) {
      return years.reduce((acc, person) => {
        const age = person.passed - person.year;
        return acc + age;
      }, 0);
    } 
    
    const totalYears = inventors.reduce((acc, cv) => {
      const age = cv.passed - cv.year;
      return acc + age;
    }, 0);

    console.log(total(inventors));
    console.log(totalYears);

    // 5. Sort the inventors by years lived

    function yearsLived (years) {
      return years.sort((a, b) =>  (b.passed - b.year) - (a.passed - a.year));
    }

    const lived = inventors.sort((a, b) => (b.passed - b.year) - (a.passed - a.year));

    console.table(yearsLived(inventors));
    console.log(lived);

    // 7. sort Exercise
    // Sort the people alphabetically by last name

    function lastSort (name) {
      return name.sort((a, b) => {
        const lastA = a.split(", ")[0];
        const lastB = b.split(", ")[0];
        return lastA.localeCompare(lastB);
      });
    }

    console.log(lastSort(people));

    // 8. Reduce Exercise
    // Sum up the instances of each of these
    const data = ['car', 'car', 'truck', 'truck', 'bike', 'walk', 'car', 'van', 'bike', 'walk', 'car', 'van', 'car', 'truck' ];

    function sumUp (sum) {
      return sum.reduce((acc, vehicle) => {
        acc[vehicle] = (acc[vehicle] || 0) + 1;
        return acc;
      }, {});
    }

    console.table(sumUp(data));
